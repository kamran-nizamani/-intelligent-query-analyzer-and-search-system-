[project]
name = "intelligent-query-analyzer"
version = "1.0.0"
description = "Intelligent Query Analyzer and Search System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-java>=0.23",
    "tree-sitter-javascript>=0.23",
    "faiss-cpu>=1.12",
    "sentence-transformers>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.12",
]

[tool.vercel]
entrypoint = "semantic_search.api:app"
