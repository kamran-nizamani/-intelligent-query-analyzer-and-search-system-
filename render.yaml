services:
  - type: web
    name: intelligent-query-analyzer-api
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn semantic_search.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: https://intelligent-query-analyzer-and-sear-one.vercel.app
      - key: DATA_DIR
        value: data
